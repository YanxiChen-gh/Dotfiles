onboarding = false
# herdr config - https://herdr.dev/docs/configuration/
[keys]
# Leader key; herdr's default is ctrl+b.
prefix = "ctrl+g"
previous_tab = "prefix+left"
next_tab = "prefix+right"
previous_workspace = "prefix+up"
next_workspace = "prefix+down"

# Choose the repository, checkout, coding agent or shell, and optional nvim
# split for a new task workspace. Native new_tab (prefix+c) still adds views
# to the current workspace.
[[keys.command]]
key = "prefix+a"
type = "popup"
description = "Choose new task workspace setup"
command = "${DOTFILES_DIR:-$HOME/dotfiles}/herdr/new-agent-tab.sh --select"

[[keys.command]]
key = "prefix+shift+a"
type = "shell"
description = "New task workspace (treehouse worktree: agent + nvim)"
command = "${DOTFILES_DIR:-$HOME/dotfiles}/herdr/new-agent-tab.sh --with-editor"

[[keys.command]]
key = "prefix+t"
type = "popup"
description = "Troubleshoot this environment"
command = '"${HOME}/.config/herdr/launchers/troubleshoot.sh"'

[ui.toast]
delivery = "herdr"

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["$repo", "$worktree"]]

[ui.sidebar.agents.rows_by_agent]
opencode = [
  [
    "state_icon",
    "workspace",
    "tab",
  ],
  [
    "agent",
  ],
  [
    "$subagent_1",
  ],
  [
    "$subagent_2",
  ],
  [
    "$subagent_3",
  ],
  [
    "$subagent_summary",
  ],
]
