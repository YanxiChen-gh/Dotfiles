# omp settings (linked to ~/.omp/agent/config.yml).
#
# Model routing keeps gpt-5.6-sol as the driver for every role, mirroring the
# opencode setup (build/plan/general all on gpt-5.6-sol). `task` is the role omp
# gives subagents, so it stays on the same model.
modelRoles:
  default: sol/gpt-5.6-sol
  plan: sol/gpt-5.6-sol:high
  slow: sol/gpt-5.6-sol:high
  task: sol/gpt-5.6-sol

retry:
  enabled: true
  maxRetries: 10
  baseDelayMs: 500
  maxDelayMs: 300000
  modelFallback: false

# Approvals. `yolo` runs everything unattended, matching the opencode `--auto`
# workflow. Safety comes from the harness gates (scope/verify/PR), which hard-block
# a tool call regardless of approval mode - not from interactive prompts. Add a
# `tools.approval.<tool>: deny` entry to hard-block a specific tool even for
# subagents, which otherwise inherit yolo.
tools:
  approvalMode: yolo

# Skills need no config: omp's built-in Claude and Agents skill providers discover
# ~/.claude/skills and ~/.agents/skills natively - the exact dirs the installer
# symlinks shared-skills, advisor, and agent-maturity skills into for opencode. So
# omp sees the same skills opencode does. (Do not add customDirectories pointing at
# the raw shared-skills checkout; it would double-load what ~/.claude/skills covers.)
