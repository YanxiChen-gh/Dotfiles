# omp provider + model catalog (linked to ~/.omp/agent/models.yml).
#
# gpt-5.6-sol is your existing opencode driver model. The leading `!` on apiKey
# tells omp to run it as a shell command at launch and use the output as the key,
# so nothing lives in this repo or your shell env - the same boundary as the Slack
# webhook. Create the file once, without a trailing newline:
#   mkdir -p ~/.claude/secrets && chmod 700 ~/.claude/secrets
#   umask 177; printf %s 'YOUR_KEY' > ~/.claude/secrets/sol-api-key.txt
#
# If gpt-5.6-sol is served by OpenAI directly, keep baseUrl as-is; if it is fronted
# by a gateway/proxy, point baseUrl there.
providers:
  sol:
    baseUrl: https://api.openai.com/v1
    api: openai-responses # gpt-5.6-sol is an OpenAI-provider model; use the Responses shape
    apiKey: '!cat "$HOME/.claude/secrets/sol-api-key.txt"'
    authHeader: true
    models:
      - id: gpt-5.6-sol
        name: GPT-5.6 Sol
        contextWindow: 400000
        maxTokens: 64000
        reasoning: true
        input: [text, image]
